{% extends "base_dashboard.html" %}

{% block page_title %}404 Not Found{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-card" style="text-align: center; max-width: 500px;">
    
    <div style="font-size: 4rem; color: var(--color-ink-faint); margin-bottom: 1rem;">
      <i class="fa-solid fa-compass"></i>
    </div>
    
    <h1 style="font-size: 2.5rem; font-weight: 700; color: var(--color-ink); margin-bottom: 0.5rem;">404</h1>
    <h2 style="font-size: 1.25rem; font-weight: 500; color: var(--color-ink-soft); margin-bottom: 1.5rem;">Page Not Found</h2>
    
    <p style="color: var(--color-ink-faint); margin-bottom: 2rem; line-height: 1.6;">
      The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
    </p>
    
    <div style="display: flex; gap: 1rem; justify-content: center;">
      <a href="javascript:history.back()" class="btn btn-outline">
        <i class="fa-solid fa-arrow-left"></i> Go Back
      </a>
      <a href="{{ url_for('auth.login') }}" class="btn btn-primary">
        <i class="fa-solid fa-house"></i> Home
      </a>
    </div>
    
  </div>
</div>
{% endblock %}
